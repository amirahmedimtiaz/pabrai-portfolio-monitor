name: Daily Pabrai Monitor

on:
  schedule:
    - cron: '0 0 * * *' # 0:00 UTC is exactly 9:00 AM JST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow GitHub to update previous_holdings.csv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python pabrai_monitor.py

      - name: Commit updated holdings
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add previous_holdings.csv history/ || git add previous_holdings.csv
          git commit -m "chore: update holdings and historical snapshots" || echo "No changes to commit"
          git push

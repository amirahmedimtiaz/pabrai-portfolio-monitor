name: Delivery regression tests

on:
  push:
    paths:
      - pabrai_monitor.py
      - requirements.txt
      - tests/**
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test with temporary holdings and mocked external services
        run: python -m unittest discover -s tests -v
